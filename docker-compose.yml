name: rutasur

x-entorno: &entorno
  KAFKA_BROKERS: kafka:29092
  MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
  ACELERACION: "120"

x-dependencias: &dependencias
  kafka-init:
    condition: service_completed_successfully
  mongo:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/crear-topics.sh:/crear-topics.sh:ro
    entrypoint: ["sh", "/crear-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: rutasur
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicia el replica set de un nodo: los change streams y las transacciones lo necesitan.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().myState == 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s

  simulador:
    build: .
    image: rutasur-servicios
    command: ["node", "services/simulador/index.js"]
    depends_on: *dependencias
    restart: on-failure
    ports:
      - "4000:4000"
    environment:
      <<: *entorno
      SEMILLA: "20260302"
      ENVIOS_POR_MINUTO: "20"
      FLUJO_CONTINUO: ${FLUJO_CONTINUO:-true}

  proyector:
    build: .
    image: rutasur-servicios
    command: ["node", "services/proyector/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  notificaciones:
    build: .
    image: rutasur-servicios
    command: ["node", "services/notificaciones/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  reprogramacion:
    build: .
    image: rutasur-servicios
    command: ["node", "services/reprogramacion/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  monitor-sla:
    build: .
    image: rutasur-servicios
    command: ["node", "services/monitor-sla/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  analitica:
    build: .
    image: rutasur-servicios
    command: ["node", "services/analitica/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  # Cuarto indicador: se activa durante la demo para mostrar el reprocesamiento.
  analitica-hub:
    profiles: [cuarto-indicador]
    build: .
    image: rutasur-servicios
    command: ["node", "services/analitica-hub/index.js"]
    depends_on: *dependencias
    restart: on-failure
    environment:
      <<: *entorno

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started
    restart: on-failure
    environment:
      MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      SIMULADOR_URL: http://simulador:4000

volumes:
  mongo-data:
